<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid slice">
  <title>All Inclusive</title>
  <defs>
    <linearGradient id="ai-light-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#eef3ff" />
      <stop offset="100%" stop-color="#cfddfa" />
    </linearGradient>
    <radialGradient id="ai-light-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="1" />
      <stop offset="60%" stop-color="#ffd98a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ai-light-sky)" />

  <circle cx="400" cy="245" r="150" fill="url(#ai-light-glow)" />
  <circle cx="400" cy="245" r="56" fill="#ffe9b8" />

  <path d="M0,300 L200,265 L380,290 L560,255 L760,285 L800,270 L800,500 L0,500 Z" fill="#eaf0ff" />
  <path d="M0,335 L180,300 L360,325 L540,290 L720,320 L800,305 L800,500 L0,500 Z" fill="#d7e2fb" />
  <path d="M0,375 L160,340 L340,365 L520,330 L700,360 L800,345 L800,500 L0,500 Z" fill="#b7c8f2" />
  <rect x="0" y="480" width="800" height="20" fill="#9fb3ea" />

  <g transform="translate(90,25)">
    <g fill="none" stroke="#2547a0" stroke-width="4" stroke-linejoin="round">
      <polygon points="250,375 285,315 380,330 365,375" />
      <rect x="263" y="371" width="115" height="72" />
      <rect x="288" y="396" width="26" height="47" rx="2" stroke-width="3" />

      <rect x="400" y="330" width="60" height="113" />

      <polygon points="470,360 490,325 528,332 518,360" opacity="0.95" />
      <rect x="476" y="358" width="48" height="85" opacity="0.95" />
    </g>
    <g fill="#2f5fdb">
      <rect x="322" y="396" width="20" height="20" rx="2" opacity="0.9" />
      <rect x="412" y="345" width="14" height="14" rx="2" opacity="0.85" />
      <rect x="434" y="345" width="14" height="14" rx="2" opacity="0.7" />
      <rect x="412" y="370" width="14" height="14" rx="2" opacity="0.6" />
      <rect x="434" y="370" width="14" height="14" rx="2" opacity="0.8" />
      <rect x="412" y="395" width="14" height="14" rx="2" opacity="0.65" />
      <rect x="487" y="375" width="12" height="12" rx="2" opacity="0.8" />
      <rect x="505" y="375" width="12" height="12" rx="2" opacity="0.65" />
      <rect x="487" y="397" width="12" height="12" rx="2" opacity="0.55" />
    </g>
  </g>

  <!-- Diamantini: il pacchetto più ricco ne ha di più, per far percepire il maggior valore. -->
  <g fill="#2f5fdb">
    <g transform="translate(430,300)">
      <polygon points="0,-8 7,0 0,10 -7,0" opacity="0.85" />
      <polygon points="0,-8 7,0 0,-1" fill="#ffffff" opacity="0.6" />
    </g>
    <g transform="translate(560,340)">
      <polygon points="0,-6 5,0 0,8 -5,0" opacity="0.75" />
      <polygon points="0,-6 5,0 0,-1" fill="#ffffff" opacity="0.6" />
    </g>
    <g transform="translate(620,290)">
      <polygon points="0,-5 4,0 0,6 -4,0" opacity="0.65" />
    </g>
  </g>
</svg>
