<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid slice">
  <title>All Inclusive</title>
  <defs>
    <linearGradient id="ai-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="40%" stop-color="#2b2b2b" />
      <stop offset="70%" stop-color="#4a4a4a" />
      <stop offset="100%" stop-color="#f2a866" />
    </linearGradient>
    <radialGradient id="ai-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="1" />
      <stop offset="60%" stop-color="#f2a866" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f2a866" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ai-sky)" />

  <g fill="#ffffff">
    <circle cx="55" cy="40" r="1.6" opacity="0.7" />
    <circle cx="110" cy="90" r="1.1" opacity="0.45" />
    <circle cx="180" cy="35" r="1.8" opacity="0.8" />
    <circle cx="245" cy="100" r="1.2" opacity="0.4" />
    <circle cx="330" cy="55" r="1.5" opacity="0.6" />
    <circle cx="400" cy="100" r="1.1" opacity="0.5" />
    <circle cx="470" cy="40" r="1.7" opacity="0.7" />
    <circle cx="545" cy="90" r="1.3" opacity="0.5" />
    <circle cx="610" cy="45" r="1.6" opacity="0.65" />
    <circle cx="680" cy="100" r="1.2" opacity="0.45" />
    <circle cx="740" cy="35" r="1.8" opacity="0.75" />
  </g>

  <circle cx="400" cy="245" r="150" fill="url(#ai-glow)" />
  <circle cx="400" cy="245" r="60" fill="#ffe3b8" />

  <path d="M0,300 L200,265 L380,290 L560,255 L760,285 L800,270 L800,500 L0,500 Z" fill="#3d3d3d" opacity="0.6" />
  <path d="M0,335 L180,300 L360,325 L540,290 L720,320 L800,305 L800,500 L0,500 Z" fill="#262626" opacity="0.85" />
  <path d="M0,375 L160,340 L340,365 L520,330 L700,360 L800,345 L800,500 L0,500 Z" fill="#181818" />
  <rect x="0" y="480" width="800" height="20" fill="#0d0d0d" />

  <g transform="translate(90,25)">
    <polygon points="250,375 285,315 380,330 365,375" fill="#0d0d0d" />
    <rect x="263" y="371" width="115" height="72" fill="#141414" />
    <rect x="288" y="396" width="26" height="47" rx="2" fill="#0d0d0d" />
    <rect x="322" y="396" width="20" height="20" rx="2" fill="#ffd27a" opacity="0.95" />
    <rect x="288" y="382" width="18" height="16" rx="2" fill="#ffd27a" opacity="0.8" />

    <rect x="400" y="330" width="60" height="113" fill="#141414" opacity="0.95" />
    <rect x="412" y="345" width="14" height="14" rx="2" fill="#ffd27a" opacity="0.9" />
    <rect x="434" y="345" width="14" height="14" rx="2" fill="#ffd27a" opacity="0.75" />
    <rect x="412" y="370" width="14" height="14" rx="2" fill="#ffd27a" opacity="0.6" />
    <rect x="434" y="370" width="14" height="14" rx="2" fill="#ffd27a" opacity="0.85" />
    <rect x="412" y="395" width="14" height="14" rx="2" fill="#ffd27a" opacity="0.7" />

    <polygon points="470,360 490,325 528,332 518,360" fill="#0d0d0d" opacity="0.95" />
    <rect x="476" y="358" width="48" height="85" fill="#141414" opacity="0.95" />
    <rect x="487" y="375" width="12" height="12" rx="2" fill="#ffd27a" opacity="0.85" />
    <rect x="505" y="375" width="12" height="12" rx="2" fill="#ffd27a" opacity="0.7" />
    <rect x="487" y="397" width="12" height="12" rx="2" fill="#ffd27a" opacity="0.6" />
  </g>

  <!-- Diamantini: il pacchetto più ricco ne ha di più, per far percepire il maggior valore. -->
  <g fill="#ffd9a0">
    <g transform="translate(430,300)">
      <polygon points="0,-8 7,0 0,10 -7,0" opacity="0.9" />
      <polygon points="0,-8 7,0 0,-1" fill="#ffffff" opacity="0.5" />
    </g>
    <g transform="translate(560,340)">
      <polygon points="0,-6 5,0 0,8 -5,0" opacity="0.85" />
      <polygon points="0,-6 5,0 0,-1" fill="#ffffff" opacity="0.5" />
    </g>
    <g transform="translate(620,290)">
      <polygon points="0,-5 4,0 0,6 -4,0" opacity="0.8" />
    </g>
  </g>

  <g stroke="#ffd9a0" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <path d="M120 70 L120 84" />
    <path d="M113 77 L127 77" />
    <path d="M660 70 L660 84" />
    <path d="M653 77 L667 77" />
  </g>
</svg>
