<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a6bea"/>
      <stop offset="100%" stop-color="#1c3880"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fa3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7fa3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="620" cy="120" r="260" fill="url(#blob1)" filter="url(#soft)"/>
  <circle cx="140" cy="480" r="220" fill="url(#blob2)" filter="url(#soft)"/>

  <!-- broadcast arcs -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round">
    <path d="M 430 300 A 90 90 0 0 1 430 300" stroke-opacity="0"/>
    <path d="M 460 220 A 130 130 0 0 1 460 380" stroke-width="6" stroke-opacity="0.35"/>
    <path d="M 500 180 A 190 190 0 0 1 500 420" stroke-width="6" stroke-opacity="0.22"/>
    <path d="M 540 140 A 250 250 0 0 1 540 460" stroke-width="6" stroke-opacity="0.12"/>
  </g>

  <!-- megaphone -->
  <g transform="translate(230,220)">
    <rect x="0" y="70" width="46" height="60" rx="8" fill="#ffffff"/>
    <path d="M 46 60 L 190 0 L 190 200 L 46 140 Z" fill="#ffffff"/>
    <path d="M 100 158 L 130 148 L 150 210 A 26 26 0 0 1 100 210 Z" fill="#ffffff"/>
    <rect x="46" y="94" width="10" height="12" fill="#1c3880"/>
  </g>

  <!-- small house glyph -->
  <g transform="translate(560,400)" fill="#ffffff" fill-opacity="0.92">
    <path d="M 40 0 L 84 34 L 84 90 L 0 90 L 0 34 Z"/>
    <rect x="20" y="52" width="18" height="38" fill="#1c3880"/>
  </g>
</svg>
