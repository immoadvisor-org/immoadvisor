<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6fe0"/>
      <stop offset="100%" stop-color="#12285f"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="60%" stop-color="#a9c3ff"/>
      <stop offset="100%" stop-color="#3a63c9"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="650" cy="470" r="240" fill="url(#blob1)" filter="url(#soft)"/>
  <circle cx="150" cy="120" r="230" fill="url(#blob2)" filter="url(#soft)"/>

  <!-- camera body -->
  <g transform="translate(210,190)">
    <rect x="0" y="40" width="380" height="230" rx="26" fill="#ffffff"/>
    <rect x="120" y="0" width="140" height="50" rx="14" fill="#ffffff"/>
    <rect x="26" y="66" width="60" height="26" rx="6" fill="#12285f"/>
    <circle cx="190" cy="160" r="92" fill="#12285f"/>
    <circle cx="190" cy="160" r="70" fill="url(#lens)"/>
    <circle cx="190" cy="160" r="70" fill="none" stroke="#12285f" stroke-width="4"/>
    <!-- aperture blades -->
    <g fill="#12285f" fill-opacity="0.55">
      <path d="M190,160 L190,110 A50,50 0 0 1 225,130 Z"/>
      <path d="M190,160 L225,130 A50,50 0 0 1 236,177 Z"/>
      <path d="M190,160 L236,177 A50,50 0 0 1 210,205 Z"/>
      <path d="M190,160 L210,205 A50,50 0 0 1 154,201 Z"/>
      <path d="M190,160 L154,201 A50,50 0 0 1 148,145 Z"/>
      <path d="M190,160 L148,145 A50,50 0 0 1 190,110 Z"/>
    </g>
    <circle cx="330" cy="90" r="14" fill="#5eead4"/>
  </g>
</svg>
