<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e6be0"/>
      <stop offset="100%" stop-color="#0f3d3a"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="630" cy="140" r="250" fill="url(#blob2)" filter="url(#soft)"/>
  <circle cx="140" cy="470" r="220" fill="url(#blob1)" filter="url(#soft)"/>

  <!-- bar chart -->
  <g fill="#ffffff">
    <rect x="250" y="330" width="56" height="120" rx="8" fill-opacity="0.55"/>
    <rect x="326" y="280" width="56" height="170" rx="8" fill-opacity="0.75"/>
    <rect x="402" y="220" width="56" height="230" rx="8"/>
  </g>

  <!-- trend arrow -->
  <path d="M 250 320 L 340 250 L 400 290 L 470 190" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 470 190 L 470 230 M 470 190 L 430 195" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- magnifying glass -->
  <g transform="translate(470,380)">
    <circle cx="0" cy="0" r="70" fill="#123a5e" fill-opacity="0.9"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="10"/>
    <line x1="36" y1="36" x2="78" y2="78" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">%</text>
  </g>
</svg>
