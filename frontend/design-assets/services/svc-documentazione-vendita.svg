<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c5fe0"/>
      <stop offset="100%" stop-color="#1d1f66"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="630" cy="130" r="250" fill="url(#blob1)" filter="url(#soft)"/>
  <circle cx="130" cy="470" r="220" fill="url(#blob2)" filter="url(#soft)"/>

  <!-- stacked documents -->
  <g>
    <rect x="255" y="150" width="230" height="300" rx="16" fill="#ffffff" fill-opacity="0.35" transform="rotate(-8 370 300)"/>
    <rect x="270" y="140" width="230" height="300" rx="16" fill="#ffffff" fill-opacity="0.6" transform="rotate(4 385 290)"/>
    <rect x="285" y="150" width="230" height="300" rx="16" fill="#ffffff"/>
    <g transform="translate(285,150)">
      <rect x="30" y="40" width="170" height="14" rx="7" fill="#c7d2fe"/>
      <rect x="30" y="72" width="140" height="10" rx="5" fill="#dbe4ff"/>
      <rect x="30" y="94" width="150" height="10" rx="5" fill="#dbe4ff"/>
      <rect x="30" y="116" width="110" height="10" rx="5" fill="#dbe4ff"/>
      <rect x="30" y="150" width="170" height="10" rx="5" fill="#dbe4ff"/>
      <rect x="30" y="172" width="130" height="10" rx="5" fill="#dbe4ff"/>
    </g>
  </g>

  <!-- seal / check -->
  <g transform="translate(470,330)">
    <circle cx="0" cy="0" r="66" fill="#1d1f66"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-dasharray="8 10"/>
    <path d="M -26 2 L -8 22 L 30 -24" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
