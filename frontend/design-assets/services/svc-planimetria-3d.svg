<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6fe0"/>
      <stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fa3ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7fa3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="640" cy="470" r="240" fill="url(#blob1)" filter="url(#soft)"/>
  <circle cx="150" cy="130" r="230" fill="url(#blob2)" filter="url(#soft)"/>

  <!-- isometric floor grid -->
  <g transform="translate(400,150)" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2">
    <path d="M -220 132 L 0 22 L 220 132 L 0 242 Z"/>
    <path d="M -110 66 L 110 66"/>
    <path d="M -220 132 L 220 132"/>
    <path d="M -110 198 L 110 198"/>
    <path d="M -110 66 L -110 198"/>
    <path d="M 0 22 L 0 242"/>
    <path d="M 110 66 L 110 198"/>
  </g>

  <!-- isometric room block (main icon) -->
  <g transform="translate(400,300)">
    <path d="M 0 -70 L 150 0 L 0 70 L -150 0 Z" fill="#ffffff"/>
    <path d="M 0 70 L 150 0 L 150 70 L 0 140 Z" fill="#c7d9ff"/>
    <path d="M 0 70 L -150 0 L -150 70 L 0 140 Z" fill="#e7edff"/>
    <path d="M 0 -70 L 150 0 L 0 70 L -150 0 Z" fill="none" stroke="#123a5e" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- orbit / 3D tour icon -->
  <g transform="translate(560,180)">
    <circle cx="0" cy="0" r="16" fill="#5eead4"/>
    <path d="M -40 0 A 40 40 0 1 1 6 39" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M 6 39 L -8 34 M 6 39 L 12 24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
