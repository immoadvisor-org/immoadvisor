<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="55%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#3a3a3a" />
    </linearGradient>
    <linearGradient id="aboutWindowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#f2a866" />
    </linearGradient>
    <radialGradient id="aboutLampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f2a866" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f2a866" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#aboutSky)" />

  <!-- stelle -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4" opacity="0.6" />
    <circle cx="140" cy="90" r="1" opacity="0.5" />
    <circle cx="320" cy="50" r="1.5" opacity="0.7" />
    <circle cx="520" cy="40" r="1.2" opacity="0.55" />
    <circle cx="700" cy="70" r="1.5" opacity="0.6" />
    <circle cx="760" cy="130" r="1.1" opacity="0.5" />
  </g>

  <!-- finestra con vista al tramonto -->
  <rect x="60" y="70" width="220" height="160" rx="16" fill="url(#aboutWindowSky)" />
  <circle cx="170" cy="180" r="40" fill="#ffe3b8" opacity="0.85" />
  <rect x="60" y="70" width="220" height="160" rx="16" fill="none" stroke="#181818" stroke-width="8" />

  <!-- pianta -->
  <rect x="640" y="330" width="46" height="54" rx="6" fill="#181818" />
  <path d="M663 330 C 630 300 620 250 640 210 C 660 250 660 300 663 330 Z" fill="#12664f" />
  <path d="M663 330 C 700 305 715 260 700 220 C 675 255 665 300 663 330 Z" fill="#178068" />

  <!-- scrivania -->
  <rect x="120" y="400" width="560" height="24" rx="4" fill="#181818" />
  <rect x="140" y="424" width="24" height="120" fill="#0d0d0d" />
  <rect x="616" y="424" width="24" height="120" fill="#0d0d0d" />

  <!-- lampada da tavolo -->
  <circle cx="600" cy="330" r="60" fill="url(#aboutLampGlow)" />
  <path d="M600 396 L600 356" stroke="#181818" stroke-width="6" stroke-linecap="round" />
  <path d="M566 356 L634 356 L600 320 Z" fill="#ffd27a" />
  <rect x="584" y="396" width="32" height="8" rx="4" fill="#181818" />

  <!-- laptop -->
  <rect x="360" y="356" width="150" height="96" rx="8" fill="#141414" />
  <rect x="372" y="368" width="126" height="72" rx="4" fill="#1f1f1f" />
  <path d="M420 388 L440 408 L480 372" fill="none" stroke="#ffd27a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="352" y="452" width="166" height="10" rx="4" fill="#141414" />

  <!-- documenti -->
  <rect x="220" y="368" width="70" height="88" rx="4" fill="#f0f0f0" stroke="#3a3a3a" stroke-width="2" />
  <rect x="232" y="384" width="46" height="6" rx="3" fill="#9a9a9a" />
  <rect x="232" y="398" width="46" height="6" rx="3" fill="#9a9a9a" />
  <rect x="232" y="412" width="30" height="6" rx="3" fill="#9a9a9a" />

  <!-- tazza -->
  <rect x="180" y="392" width="34" height="30" rx="6" fill="none" stroke="#f0f0f0" stroke-width="3" />
  <path d="M214 398 q14 0 14 10 q0 10 -14 10" fill="none" stroke="#f0f0f0" stroke-width="3" />
</svg>
